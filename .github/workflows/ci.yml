name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Stdlib-only tool: pytest and mypy are the only extras, and only for the gate itself.
      - name: Offline check
        env:
          PYTHON: python
        run: uv run --python ${{ matrix.python }} --with pytest --with mypy ./scripts/check.sh
